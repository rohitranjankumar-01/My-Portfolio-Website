<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#111D30"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Base -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGrad)" stroke="#1C2E4A" stroke-width="2.5"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="5" y="5" width="54" height="54" rx="12" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
  
  <!-- Stylized Geometric "R" Monogram -->
  <path d="M 21 17 L 35 17 C 41 17 45 20.5 45 26 C 45 30.5 41.5 33.5 36.5 34.5 L 45.5 47 L 38 47 L 30 35 L 28 35 L 28 47 L 21 47 Z M 28 29.5 L 34.5 29.5 C 37.5 29.5 39 28.2 39 26 C 39 23.8 37.5 22.5 34.5 22.5 L 28 22.5 Z" 
        fill="url(#accentGrad)" 
        filter="url(#glow)"/>
        
  <!-- Tech Terminal Accent Dot -->
  <circle cx="44" cy="18" r="2.5" fill="#38BDF8"/>
</svg>
